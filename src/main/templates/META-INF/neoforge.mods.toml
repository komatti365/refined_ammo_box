modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL="https://github.com/nanaios-modding/refined_ammo_box/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile="refined_ammo_box.png"
authors = "${mod_authors}"
credits= "${mod_credits}"
description = '''${mod_description}'''


[[dependencies.${mod_id}]]
modId = "neoforge"
type="required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type="required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId="refinedstorage"
type="required"
versionRange="[2.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tacz"
type="required"
versionRange="[1.1.8,)"
ordering="AFTER"
side="BOTH"
